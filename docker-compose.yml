services:

  postgres:
    image: postgres:18
    container_name: url-shortener-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kanumonu@123
      POSTGRES_DB: urlshortener

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: url-shortener-redis

    ports:
      - "6379:6379"

  api:
    build: .
    container_name: url-shortener-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:kanumonu%40123@postgres:5432/urlshortener
      REDIS_URL:  redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: